name: CI/CD Pipeline

on:
  push:
    branches:
      - team/Romanenko

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flask

      - name: Run local server verification
        run: |
          python -m py_compile Additional_Task/app.py Additional_Task/auth_service.py

  deploy:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Trigger Render Deploy Hook
        run: |
          curl -X GET "https://api.render.com/deploy/srv-d8k3uggu3fls73b9sclg?key=c6OpqujOcRE"